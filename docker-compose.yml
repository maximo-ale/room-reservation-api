services:
  node:
    build: .
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/node_modules
    container_name: node_container
    ports:
      - 3000:3000
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    container_name: db_container
    env_file:
      - .env
    volumes:
      - db_volume:/var/lib/postgresql/data
    ports:
      - 5432:5432

volumes:
  db_volume: